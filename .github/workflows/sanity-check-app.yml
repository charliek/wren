name: sanity-check-app

# Manual verification that the release-bot GitHub App is wired into every repo
# wren's release.yml touches: wren itself, and charliek/apt-charliek (the
# publish dispatch target). Run from the Actions UI ("Run workflow") after
# setting the RELEASE_BOT_* secrets and installing the App on both repos.
#
# Useful when:
#   * first wiring the App into this repo (verify before the first release)
#   * rotating the App's private key (re-verify after updating the secret)
#   * migrating to a new App
#   * after adopting a new cross-repo target (add a block for it; re-run)
#
# Each block mints a short-lived installation token scoped to one repo and
# calls a read-only endpoint. A failure to mint, or a 404 on the reach check,
# means the App isn't installed on that repo: fix the install before the next
# release runs.
#
# Bot identity comes from the action's `app-slug` output, NOT `gh api /user`,
# which returns 403 for installation tokens.

on:
  workflow_dispatch: {}

permissions: {}   # this workflow needs nothing from the workflow token

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ── 1. self (charliek/wren) ──
      - id: self-token
        uses: actions/create-github-app-token@v3
        with:
          client-id:   ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_KEY }}

      - name: Token sees wren + bot identity
        env:
          GH_TOKEN: ${{ steps.self-token.outputs.token }}
          BOT_SLUG: ${{ steps.self-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          echo "::group::This repo (must print ${GITHUB_REPOSITORY})"
          gh api "/repos/${GITHUB_REPOSITORY}" --jq '.full_name'
          echo "::endgroup::"

          echo "::group::Installation repository count (informational)"
          # The count of repos in THIS repo's installation, not the App's
          # footprint: with per-repo selective installs it is 1. Cross-repo
          # minting reaches other installations through the App's key, so the
          # block below is the real check; never assert on this number. Count
          # only, because names of private repos would leak into a public log.
          gh api /installation/repositories --jq '.total_count'
          echo "::endgroup::"

          echo "::group::Bot identity (should end with [bot])"
          echo "${BOT_SLUG}[bot]"
          echo "::endgroup::"

      # ── 2. charliek/apt-charliek (publish dispatch target) ──
      - id: apt-token
        uses: actions/create-github-app-token@v3
        with:
          client-id:    ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key:  ${{ secrets.RELEASE_BOT_APP_KEY }}
          owner:        charliek
          repositories: apt-charliek
          # Pin the floor to what release.yml's dispatch needs.
          permission-contents: write

      - name: Token can reach charliek/apt-charliek
        env:
          GH_TOKEN: ${{ steps.apt-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "::group::charliek/apt-charliek (must print the same)"
          gh api "/repos/charliek/apt-charliek" --jq '.full_name'
          echo "::endgroup::"
