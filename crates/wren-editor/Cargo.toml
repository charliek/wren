[package]
name = "wren-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "A Markdown editor widget for iced 0.14"

[lints]
workspace = true

[features]
# Accessors the host's functional test harness reads; not part of the API.
test-support = []

[dependencies]
# The least iced the widget builds with, so a host chooses the rest: the
# widget draws through the concrete iced::Renderer, which needs a renderer;
# iced always pulls in winit, which needs a windowing feature on Linux; and
# iced needs an executor (a host's tokio takes precedence over the pool).
iced = { version = "=0.14.0", default-features = false, features = [
    "advanced",
    "thread-pool",
    "tiny-skia",
    "x11",
] }
unicode-segmentation.workspace = true
wren-markdown.workspace = true
