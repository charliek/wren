[package]
name = "wren-iced"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "wren"
path = "src/main.rs"

[features]
smoke-test = ["wren-editor/test-support", "wren-canvas/test-support", "iced/sysinfo", "dep:serde_json", "dep:tokio", "dep:rustix"]

[dependencies]
wren-board.workspace = true
wren-canvas.workspace = true
wren-core.workspace = true
wren-editor.workspace = true
wren-markdown.workspace = true
iced.workspace = true
rfd.workspace = true
# Decodes the embedded window icon; its dependencies already ship via tiny-skia.
png.workspace = true
swash.workspace = true
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true
wren-sparkle.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Already in the tree through iced's svg feature: a test renders the board
# SVG export's text to compare it with what the canvas measured.
resvg = { version = "=0.45.1", default-features = false, features = ["text"] }
# The app's unit tests read the editor's and the board viewer's test
# accessors too.
wren-canvas = { workspace = true, features = ["test-support"] }
wren-editor = { workspace = true, features = ["test-support"] }
