# The keyboard model's result for the acceptance script of discovery/boards.md,
# section 5.20, ported from the model's output as data.
#
# `script` is that script, a line of it to a line here or two. A key is its
# name after any of the modifiers `shift` and `mod` (Cmd on macOS, Ctrl on
# Linux); `type:` is text typed into a label or the connect query.
#
# Each `node` is 6 by 3 cells (120 by 60), `at` its top-left corner in cells
# relative to Start's. Ids are random, so nodes are named by their labels,
# which are unique, and connectors by the labels of their ends.

script = [
  "u", "tab", "type:Start", "tab", "type:Receive order", "escape", "d", "tab", "type:Valid?",
  "escape", "mod+right", "type:Reject order", "escape", "shift+mod+left", "enter", "type:No", "escape", "left",
  "tab", "type:Check stock", "escape", "shift+mod+up", "enter", "type:Yes", "escape", "d", "tab", "type:In stock?",
  "escape", "mod+right", "type:Backorder", "escape", "shift+mod+left", "enter", "type:No",
  "tab", "type:Notify customer", "escape", "c", "type:che", "enter", "left", "down",
  "tab", "type:Charge card", "escape", "shift+mod+up", "enter", "type:Yes", "escape", "d", "tab", "type:Payment ok?",
  "escape", "mod+right", "type:Retry payment", "escape", "shift+mod+left", "enter", "type:No",
  "escape", "right", "c", "type:cha", "enter", "left", "down",
  "tab", "type:Pack", "escape", "shift+mod+up", "enter", "type:Yes", "tab", "type:Ship", "tab", "type:Send receipt",
  "escape", "u", "tab", "type:End",
  "escape", "up", "up", "up", "up", "up", "up", "up", "up", "right", "c", "type:end", "enter",
]

