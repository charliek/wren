[workspace]
resolver = "2"
members = ["crates/wren-core", "crates/wren-editor", "crates/wren-iced", "crates/wren-markdown", "crates/wren-sparkle"]
exclude = ["vendor/cosmic-text", "vendor/iced_winit", "vendor/swash"]
default-members = ["crates/wren-iced"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false
license = "MIT"

[workspace.dependencies]
wren-core = { path = "crates/wren-core" }
wren-editor = { path = "crates/wren-editor" }
wren-sparkle = { path = "crates/wren-sparkle" }
wren-markdown = { path = "crates/wren-markdown" }
iced = { version = "=0.14.0", default-features = false, features = [
    "advanced",
    "crisp",
    "linux-theme-detection",
    "svg",
    "tiny-skia",
    "tokio",
    "wayland",
    "web-colors",
    "wgpu",
    "x11",
] }
png = "=0.18.1"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", default-features = false, features = ["net", "io-util", "sync", "time", "rt", "macros"] }
rustix = { version = "=1.1.6", features = ["fs", "process"] }
tempfile = "=3.27.0"
notify = "=8.2.1"
trash = "=5.3.0"
toml = "=1.1.8"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
nucleo-matcher = "=0.3.1"
unicode-segmentation = "=1.13.3"
directories = "=6.0.0"
muda = { version = "=0.21.2", default-features = false }
rfd = { version = "=0.16.1", default-features = false, features = ["xdg-portal", "tokio", "wayland"] }
# Already in the tree through iced's text stack; Wren reads font tables with it.
swash = { version = "=0.2.10", default-features = false, features = ["std"] }

[patch.crates-io]
# A hanging indent for wrapped rows; see vendor/cosmic-text/WREN.md.
cosmic-text = { path = "vendor/cosmic-text" }
iced_winit = { path = "vendor/iced_winit" }
# Safety fixes for fonts with malformed tables; see vendor/swash/WREN.md.
swash = { path = "vendor/swash" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
