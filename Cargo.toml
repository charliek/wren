[workspace]
resolver = "2"
members = [
    "crates/wren-board",
    "crates/wren-canvas",
    "crates/wren-core",
    "crates/wren-editor",
    "crates/wren-iced",
    "crates/wren-markdown",
    "crates/wren-sparkle",
    "crates/wren-spell",
]
exclude = ["vendor/cosmic-text", "vendor/iced_tiny_skia", "vendor/iced_winit", "vendor/swash"]
default-members = ["crates/wren-iced"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.97"
publish = false
license = "MIT"

[workspace.dependencies]
wren-board = { path = "crates/wren-board" }
wren-canvas = { path = "crates/wren-canvas" }
wren-core = { path = "crates/wren-core" }
wren-editor = { path = "crates/wren-editor" }
wren-sparkle = { path = "crates/wren-sparkle" }
wren-markdown = { path = "crates/wren-markdown" }
wren-spell = { path = "crates/wren-spell" }
iced = { version = "=0.14.0", default-features = false, features = [
    "advanced",
    "canvas",
    "crisp",
    "linux-theme-detection",
    "svg",
    "tiny-skia",
    "tokio",
    "wayland",
    "web-colors",
    "wgpu",
    "x11",
] }
# Already in the tree under iced; Wren reads trackpad pinches from its
# vendored copy (vendor/iced_winit/WREN.md). No features of its own: iced's.
iced_winit = { version = "=0.14.1", default-features = false }
png = "=0.18.1"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", default-features = false, features = ["net", "io-util", "sync", "time", "rt", "macros"] }
rustix = { version = "=1.1.6", features = ["fs", "process"] }
tempfile = "=3.27.0"
notify = "=8.2.1"
trash = "=5.3.0"
toml = "=1.1.8"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
nucleo-matcher = "=0.3.1"
unicode-segmentation = "=1.13.3"
# MPL-2.0, used unmodified; THIRD_PARTY_NOTICES.txt names it (tools/package.py).
spellbook = "=0.4.2"
directories = "=6.0.0"
muda = { version = "=0.21.2", default-features = false }
rfd = { version = "=0.16.1", default-features = false, features = ["xdg-portal", "tokio", "wayland"] }
# Already in the tree through iced's text stack; Wren reads font tables with it.
swash = { version = "=0.2.10", default-features = false, features = ["std"] }

[patch.crates-io]
# A hanging indent for wrapped rows; see vendor/cosmic-text/WREN.md.
cosmic-text = { path = "vendor/cosmic-text" }
# Repaints a frame in fewer damage groups; see vendor/iced_tiny_skia/WREN.md.
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
# Screenshots of a presented frame, and trackpad pinches; see
# vendor/iced_winit/WREN.md.
iced_winit = { path = "vendor/iced_winit" }
# Safety fixes for fonts with malformed tables; see vendor/swash/WREN.md.
swash = { path = "vendor/swash" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
