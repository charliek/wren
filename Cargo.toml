[workspace]
resolver = "2"
members = ["crates/wren-core", "crates/wren-iced"]
exclude = ["vendor/iced_winit"]
default-members = ["crates/wren-iced"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.97"
publish = false
license = "MIT"

[workspace.dependencies]
wren-core = { path = "crates/wren-core" }
iced = { version = "=0.14.0", default-features = false, features = [
    "advanced",
    "crisp",
    "highlighter",
    "linux-theme-detection",
    "svg",
    "tiny-skia",
    "tokio",
    "wayland",
    "web-colors",
    "wgpu",
    "x11",
] }
png = "=0.18.1"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", default-features = false, features = ["net", "io-util", "sync", "time", "rt", "macros"] }
rustix = { version = "=1.1.6", features = ["fs", "process"] }
tempfile = "=3.27.0"
notify = "=8.2.1"
trash = "=5.3.0"
toml = "=1.1.8"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
nucleo-matcher = "=0.3.1"
directories = "=6.0.0"
muda = { version = "=0.21.2", default-features = false }
rfd = { version = "=0.16.1", default-features = false, features = ["xdg-portal", "tokio", "wayland"] }

[patch.crates-io]
iced_winit = { path = "vendor/iced_winit" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
