[project]
name = "wren-tests"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
docs = [
    "zensical>=0.0.52",
    "stridelabs-docs-theme",
]
test = [
    "pytest==9.0.3",
    "pytest-timeout==2.3.1",
]

# The shared StrideLabs docs theme, installed from its public repo; uv.lock
# pins the resolved commit alongside the tag.
[tool.uv.sources]
stridelabs-docs-theme = { git = "https://github.com/charliek/stridelabs-docs-theme", tag = "v0.2.2" }

[tool.pytest.ini_options]
testpaths = ["tools/wrentest"]
pythonpath = ["."]
addopts = "--timeout=120 --strict-markers"
markers = ["native_x11: actual keyboard and clipboard input; required in the X11 lanes"]
